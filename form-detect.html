<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Form detection — JDM Consultants LLC</title>
</head>
<body>
<!-- Static copy of the quote form so Netlify's build-time parser always
     registers it. Not linked from anywhere; users never see this page. -->
<form name="quote-request" method="POST"
          data-netlify="true" netlify-honeypot="bot-field" action="/thanks">
      <input type="hidden" name="form-name" value="quote-request">
      <p><label>Leave this empty: <input name="bot-field"></label></p>
      <div>
        <div><label for="fname">First Name</label><input id="fname" name="first-name" type="text" autocomplete="given-name"></div>
        <div><label for="lname">Last Name</label><input id="lname" name="last-name" type="text" autocomplete="family-name"></div>
      </div>
      <div><label for="email">Email Address</label><input id="email" name="email" type="email" autocomplete="email"></div>
      <div><label for="phone">Phone Number</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
      <div>
        <label for="service">Service Needed</label>
        <select id="service" name="service">
          <option value="">Select a service...</option>
          <option>Civil Site Design</option>
          <option>Construction Plans</option>
          <option>Project Management</option>
          <option>Residential Community</option>
          <option>Commercial / Retail</option>
          <option>Public Works</option>
          <option>Other / Not Sure</option>
        </select>
      </div>
      <div><label for="details">Project Details</label><textarea id="details" name="details"></textarea></div>
      <div>
        <button type="submit">
          Send Message
          
        </button>
      </div>
    </form>
</body>
</html>
